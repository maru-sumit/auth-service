spring:
  application:
    name: auth-service

#  datasource:
#    url: jdbc:postgresql://localhost:5432/easyshop
#    username: postgres
#    password: root
#    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate   # use 'validate' in production
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: auth
        format_sql: true

  sql:
    init:
      mode: never

#sql db details
app:
  datasource:
    jdbc-url: jdbc:postgresql://localhost:5432/easyshop
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver

server:
  port: 8081
